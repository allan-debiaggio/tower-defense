<svg viewBox="0 0 400 150" xmlns="http://www.w3.org/2000/svg">
  <!-- Fire Flower Tower -->
  <g id="fire-flower-tower">
    <!-- Base -->
    <rect x="10" y="90" width="60" height="50" fill="#8B4513" stroke="#654321" stroke-width="2"/>
    <rect x="15" y="85" width="50" height="10" fill="#A0522D"/>
    
    <!-- Stem -->
    <rect x="35" y="60" width="10" height="30" fill="#228B22"/>
    
    <!-- Flower petals -->
    <ellipse cx="25" cy="55" rx="8" ry="12" fill="#FF4500" transform="rotate(-30 25 55)"/>
    <ellipse cx="55" cy="55" rx="8" ry="12" fill="#FF4500" transform="rotate(30 55 55)"/>
    <ellipse cx="40" cy="40" rx="8" ry="12" fill="#FF4500"/>
    <ellipse cx="40" cy="70" rx="8" ry="12" fill="#FF4500"/>
    
    <!-- Center -->
    <circle cx="40" cy="55" r="8" fill="#FFD700"/>
    <circle cx="40" cy="55" r="4" fill="#FFA500"/>
    
    <!-- Eyes -->
    <circle cx="37" cy="52" r="2" fill="#000"/>
    <circle cx="43" cy="52" r="2" fill="#000"/>
    <circle cx="37.5" cy="51.5" r="0.8" fill="#FFF"/>
    <circle cx="43.5" cy="51.5" r="0.8" fill="#FFF"/>
  </g>
  
  <!-- Koopa Shell Tower -->
  <g id="koopa-tower">
    <!-- Base -->
    <rect x="110" y="90" width="60" height="50" fill="#8B4513" stroke="#654321" stroke-width="2"/>
    <rect x="115" y="85" width="50" height="10" fill="#A0522D"/>
    
    <!-- Shell -->
    <ellipse cx="140" cy="70" rx="25" ry="20" fill="#00AA00"/>
    <ellipse cx="140" cy="65" rx="20" ry="15" fill="#00CC00"/>
    
    <!-- Shell pattern -->
    <rect x="125" y="60" width="30" height="4" fill="#008800"/>
    <rect x="125" y="68" width="30" height="4" fill="#008800"/>
    <rect x="125" y="76" width="30" height="4" fill="#008800"/>
    
    <!-- Spikes -->
    <polygon points="125,55 130,50 135,55" fill="#666"/>
    <polygon points="135,55 140,50 145,55" fill="#666"/>
    <polygon points="145,55 150,50 155,55" fill="#666"/>
    
    <!-- Eyes -->
    <circle cx="135" cy="65" r="3" fill="#000"/>
    <circle cx="145" cy="65" r="3" fill="#000"/>
    <circle cx="136" cy="64" r="1" fill="#FFF"/>
    <circle cx="146" cy="64" r="1" fill="#FFF"/>
  </g>
  
  <!-- P-Switch Tower -->
  <g id="p-switch-tower">
    <!-- Base -->
    <rect x="210" y="90" width="60" height="50" fill="#8B4513" stroke="#654321" stroke-width="2"/>
    <rect x="215" y="85" width="50" height="10" fill="#A0522D"/>
    
    <!-- Switch base -->
    <rect x="225" y="70" width="30" height="20" fill="#4169E1" stroke="#000080" stroke-width="2"/>
    
    <!-- Switch button -->
    <rect x="230" y="60" width="20" height="15" fill="#87CEEB" stroke="#4169E1" stroke-width="2"/>
    
    <!-- P letter -->
    <text x="240" y="72" font-family="Arial Black" font-size="12" fill="#FFF" text-anchor="middle">P</text>
    
    <!-- Mechanism lines -->
    <line x1="235" y1="85" x2="235" y2="90" stroke="#666" stroke-width="2"/>
    <line x1="245" y1="85" x2="245" y2="90" stroke="#666" stroke-width="2"/>
  </g>
  
  <!-- Labels -->
  <text x="40" y="155" font-family="Arial" font-size="12" fill="#000" text-anchor="middle">Fire Flower</text>
  <text x="140" y="155" font-family="Arial" font-size="12" fill="#000" text-anchor="middle">Koopa Shell</text>
  <text x="240" y="155" font-family="Arial" font-size="12" fill="#000" text-anchor="middle">P-Switch</text>
</svg>