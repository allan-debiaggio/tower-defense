<svg width="800" height="600"
  xmlns="http://www.w3.org/2000/svg">
  <!-- Sky -->
  <rect width="800" height="600" fill="#AEEFFF"/>
  <!-- Hills -->
  <ellipse cx="150" cy="550" rx="120" ry="60" fill="#6CB944"/>
  <ellipse cx="650" cy="570" rx="180" ry="80" fill="#6CB944"/>
  <ellipse cx="400" cy="590" rx="100" ry="40" fill="#5AA03B"/>
  <!-- Bushes -->
  <ellipse cx="100" cy="580" rx="40" ry="18" fill="#43A047"/>
  <ellipse cx="700" cy="590" rx="50" ry="20" fill="#43A047"/>
  <!-- Clouds -->
  <ellipse cx="200" cy="100" rx="40" ry="18" fill="#FFF"/>
  <ellipse cx="600" cy="80" rx="60" ry="22" fill="#FFF"/>
  <!-- Winding Path -->
  <path d="M 60 600 Q 120 400 300 500 Q 500 600 600 400 Q 700 250 780 350" fill="none" stroke="#D2A679" stroke-width="40"/>
  <path d="M 60 600 Q 120 400 300 500 Q 500 600 600 400 Q 700 250 780 350" fill="none" stroke="#B97A57" stroke-width="8"/>
  <!-- Tower Pads -->
  <circle cx="120" cy="470" r="28" fill="#FFFDE7" stroke="#FFD600" stroke-width="4"/>
  <circle cx="250" cy="520" r="28" fill="#FFFDE7" stroke="#FFD600" stroke-width="4"/>
  <circle cx="400" cy="570" r="28" fill="#FFFDE7" stroke="#FFD600" stroke-width="4"/>
  <circle cx="550" cy="500" r="28" fill="#FFFDE7" stroke="#FFD600" stroke-width="4"/>
  <circle cx="670" cy="370" r="28" fill="#FFFDE7" stroke="#FFD600" stroke-width="4"/>
  <!-- Castle -->
  <g transform="translate(720,300)">
    <!-- Main body -->
    <rect x="0" y="120" width="60" height="80" fill="#F44336" stroke="#B71C1C" stroke-width="4"/>
    <!-- Roof -->
    <polygon points="-10,120 30,80 70,120" fill="#FFD600" stroke="#B71C1C" stroke-width="4"/>
    <!-- Door -->
    <rect x="25" y="170" width="10" height="30" fill="#795548" stroke="#3E2723" stroke-width="2"/>
    <!-- Towers -->
    <rect x="-20" y="140" width="20" height="60" fill="#F44336" stroke="#B71C1C" stroke-width="3"/>
    <rect x="60" y="140" width="20" height="60" fill="#F44336" stroke="#B71C1C" stroke-width="3"/>
    <polygon points="-25,140 -10,120 0,140" fill="#FFD600" stroke="#B71C1C" stroke-width="2"/>
    <polygon points="80,140 70,120 65,140" fill="#FFD600" stroke="#B71C1C" stroke-width="2"/>
    <!-- Peach -->
    <ellipse cx="30" cy="110" rx="10" ry="18" fill="#F8BBD0"/>
    <ellipse cx="30" cy="100" rx="8" ry="8" fill="#F8BBD0"/>
    <ellipse cx="30" cy="95" rx="10" ry="4" fill="#E91E63"/>
    <rect x="25" y="85" width="10" height="6" fill="#FFD600"/>
    <circle cx="30" cy="85" r="4" fill="#FFD600" stroke="#FBC02D" stroke-width="2"/>
  </g>
  <!-- Grid Overlay -->
  <g opacity="0.2">
    <g>
      <!-- Vertical lines -->
      <line x1="0" y1="0" x2="0" y2="600" stroke="#000" stroke-width="1"/>
      <line x1="100" y1="0" x2="100" y2="600" stroke="#000" stroke-width="1"/>
      <line x1="200" y1="0" x2="200" y2="600" stroke="#000" stroke-width="1"/>
      <line x1="300" y1="0" x2="300" y2="600" stroke="#000" stroke-width="1"/>
      <line x1="400" y1="0" x2="400" y2="600" stroke="#000" stroke-width="1"/>
      <line x1="500" y1="0" x2="500" y2="600" stroke="#000" stroke-width="1"/>
      <line x1="600" y1="0" x2="600" y2="600" stroke="#000" stroke-width="1"/>
      <line x1="700" y1="0" x2="700" y2="600" stroke="#000" stroke-width="1"/>
      <line x1="800" y1="0" x2="800" y2="600" stroke="#000" stroke-width="1"/>
    </g>
    <g>
      <!-- Horizontal lines -->
      <line x1="0" y1="0" x2="800" y2="0" stroke="#000" stroke-width="1"/>
      <line x1="0" y1="100" x2="800" y2="100" stroke="#000" stroke-width="1"/>
      <line x1="0" y1="200" x2="800" y2="200" stroke="#000" stroke-width="1"/>
      <line x1="0" y1="300" x2="800" y2="300" stroke="#000" stroke-width="1"/>
      <line x1="0" y1="400" x2="800" y2="400" stroke="#000" stroke-width="1"/>
      <line x1="0" y1="500" x2="800" y2="500" stroke="#000" stroke-width="1"/>
      <line x1="0" y1="600" x2="800" y2="600" stroke="#000" stroke-width="1"/>
    </g>
  </g>
</svg> 