<svg viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Goomba Animation Frames -->
  <g id="goomba-frame1">
    <!-- Body -->
    <ellipse cx="50" cy="140" rx="25" ry="20" fill="#8B4513"/>
    <ellipse cx="50" cy="135" rx="20" ry="15" fill="#A0522D"/>
    
    <!-- Eyes -->
    <circle cx="43" cy="130" r="4" fill="#000"/>
    <circle cx="57" cy="130" r="4" fill="#000"/>
    <circle cx="44" cy="129" r="1.5" fill="#FFF"/>
    <circle cx="58" cy="129" r="1.5" fill="#FFF"/>
    
    <!-- Eyebrows -->
    <path d="M38 125 Q43 122 48 125" stroke="#654321" stroke-width="2" fill="none"/>
    <path d="M52 125 Q57 122 62 125" stroke="#654321" stroke-width="2" fill="none"/>
    
    <!-- Fangs -->
    <polygon points="46,140 48,145 50,140" fill="#FFF"/>
    <polygon points="50,140 52,145 54,140" fill="#FFF"/>
    
    <!-- Feet -->
    <ellipse cx="40" cy="155" rx="8" ry="5" fill="#654321"/>
    <ellipse cx="60" cy="155" rx="8" ry="5" fill="#654321"/>
  </g>
  
  <g id="goomba-frame2" transform="translate(100,0)">
    <!-- Body (slightly squished for walking) -->
    <ellipse cx="50" cy="142" rx="25" ry="18" fill="#8B4513"/>
    <ellipse cx="50" cy="137" rx="20" ry="13" fill="#A0522D"/>
    
    <!-- Eyes -->
    <circle cx="43" cy="132" r="4" fill="#000"/>
    <circle cx="57" cy="132" r="4" fill="#000"/>
    <circle cx="44" cy="131" r="1.5" fill="#FFF"/>
    <circle cx="58" cy="131" r="1.5" fill="#FFF"/>
    
    <!-- Eyebrows -->
    <path d="M38 127 Q43 124 48 127" stroke="#654321" stroke-width="2" fill="none"/>
    <path d="M52 127 Q57 124 62 127" stroke="#654321" stroke-width="2" fill="none"/>
    
    <!-- Fangs -->
    <polygon points="46,142 48,147 50,142" fill="#FFF"/>
    <polygon points="50,142 52,147 54,142" fill="#FFF"/>
    
    <!-- Feet (walking position) -->
    <ellipse cx="35" cy="157" rx="8" ry="5" fill="#654321"/>
    <ellipse cx="65" cy="157" rx="8" ry="5" fill="#654321"/>
  </g>
  
  <!-- Koopa Troopa Animation Frames -->
  <g id="koopa-frame1" transform="translate(200,0)">
    <!-- Shell -->
    <ellipse cx="50" cy="145" rx="20" ry="15" fill="#00AA00"/>
    <ellipse cx="50" cy="140" rx="15" ry="12" fill="#00CC00"/>
    
    <!-- Shell pattern -->
    <rect x="35" y="135" width="30" height="3" fill="#008800"/>
    <rect x="35" y="142" width="30" height="3" fill="#008800"/>
    <rect x="35" y="149" width="30" height="3" fill="#008800"/>
    
    <!-- Head -->
    <ellipse cx="50" cy="125" rx="12" ry="10" fill="#FFFF99"/>
    
    <!-- Eyes -->
    <circle cx="46" cy="123" r="3" fill="#000"/>
    <circle cx="54" cy="123" r="3" fill="#000"/>
    <circle cx="47" cy="122" r="1" fill="#FFF"/>
    <circle cx="55" cy="122" r="1" fill="#FFF"/>
    
    <!-- Beak -->
    <polygon points="50,128 48,132 52,132" fill="#FFA500"/>
    
    <!-- Arms -->
    <ellipse cx="35" cy="135" rx="5" ry="8" fill="#FFFF99"/>
    <ellipse cx="65" cy="135" rx="5" ry="8" fill="#FFFF99"/>
    
    <!-- Legs -->
    <ellipse cx="42" cy="160" rx="6" ry="8" fill="#FFFF99"/>
    <ellipse cx="58" cy="160" rx="6" ry="8" fill="#FFFF99"/>
    
    <!-- Feet -->
    <ellipse cx="40" cy="168" rx="8" ry="4" fill="#FFA500"/>
    <ellipse cx="60" cy="168" rx="8" ry="4" fill="#FFA500"/>
  </g>
  
  <g id="koopa-frame2" transform="translate(300,0)">
    <!-- Shell -->
    <ellipse cx="50" cy="147" rx="20" ry="15" fill="#00AA00"/>
    <ellipse cx="50" cy="142" rx="15" ry="12" fill="#00CC00"/>
    
    <!-- Shell pattern -->
    <rect x="35" y="137" width="30" height="3" fill="#008800"/>
    <rect x="35" y="144" width="30" height="3" fill="#008800"/>
    <rect x="35" y="151" width="30" height="3" fill="#008800"/>
    
    <!-- Head -->
    <ellipse cx="50" cy="127" rx="12" ry="10" fill="#FFFF99"/>
    
    <!-- Eyes -->
    <circle cx="46" cy="125" r="3" fill="#000"/>
    <circle cx="54" cy="125" r="3" fill="#000"/>
    <circle cx="47" cy="124" r="1" fill="#FFF"/>
    <circle cx="55" cy="124" r="1" fill="#FFF"/>
    
    <!-- Beak -->
    <polygon points="50,130 48,134 52,134" fill="#FFA500"/>
    
    <!-- Arms (walking position) -->
    <ellipse cx="32" cy="137" rx="5" ry="8" fill="#FFFF99"/>
    <ellipse cx="68" cy="137" rx="5" ry="8" fill="#FFFF99"/>
    
    <!-- Legs (walking position) -->
    <ellipse cx="38" cy="162" rx="6" ry="8" fill="#FFFF99"/>
    <ellipse cx="62" cy="162" rx="6" ry="8" fill="#FFFF99"/>
    
    <!-- Feet -->
    <ellipse cx="36" cy="170" rx="8" ry="4" fill="#FFA500"/>
    <ellipse cx="64" cy="170" rx="8" ry="4" fill="#FFA500"/>
  </g>
  
  <!-- Paragoomba Animation Frames -->
  <g id="paragoomba-frame1" transform="translate(400,0)">
    <!-- Body -->
    <ellipse cx="50" cy="140" rx="20" ry="16" fill="#8B4513"/>
    <ellipse cx="50" cy="136" rx="16" ry="12" fill="#A0522D"/>
    
    <!-- Eyes -->
    <circle cx="45" cy="132" r="3" fill="#000"/>
    <circle cx="55" cy="132" r="3" fill="#000"/>
    <circle cx="46" cy="131" r="1" fill="#FFF"/>
    <circle cx="56" cy="131" r="1" fill="#FFF"/>
    
    <!-- Eyebrows -->
    <path d="M40 128 Q45 125 50 128" stroke="#654321" stroke-width="2" fill="none"/>
    <path d="M50 128 Q55 125 60 128" stroke="#654321" stroke-width="2" fill="none"/>
    
    <!-- Wings (up position) -->
    <ellipse cx="35" cy="125" rx="8" ry="15" fill="#FFF" transform="rotate(-20 35 125)"/>
    <ellipse cx="65" cy="125" rx="8" ry="15" fill="#FFF" transform="rotate(20 65 125)"/>
    
    <!-- Wing details -->
    <path d="M30 115 Q35 125 30 135" stroke="#DDD" stroke-width="1" fill="none"/>
    <path d="M70 115 Q65 125 70 135" stroke="#DDD" stroke-width="1" fill="none"/>
  </g>
  
  <g id="paragoomba-frame2" transform="translate(500,0)">
    <!-- Body -->
    <ellipse cx="50" cy="140" rx="20" ry="16" fill="#8B4513"/>
    <ellipse cx="50" cy="136" rx="16" ry="12" fill="#A0522D"/>
    
    <!-- Eyes -->
    <circle cx="45" cy="132" r="3" fill="#000"/>
    <circle cx="55" cy="132" r="3" fill="#000"/>
    <circle cx="46" cy="131" r="1" fill="#FFF"/>
    <circle cx="56" cy="131" r="1" fill="#FFF"/>
    
    <!-- Eyebrows -->
    <path d="M40 128 Q45 125 50 128" stroke="#654321" stroke-width="2" fill="none"/>
    <path d="M50 128 Q55 125 60 128" stroke="#654321" stroke-width="2" fill="none"/>
    
    <!-- Wings (down position) -->
    <ellipse cx="35" cy="135" rx="8" ry="12" fill="#FFF" transform="rotate(-45 35 135)"/>
    <ellipse cx="65" cy="135" rx="8" ry="12" fill="#FFF" transform="rotate(45 65 135)"/>
    
    <!-- Wing details -->
    <path d="M28 130 Q35 135 32 142" stroke="#DDD" stroke-width="1" fill="none"/>
    <path d="M72 130 Q65 135 68 142" stroke="#DDD" stroke-width="1" fill="none"/>
  </g>
  
  <!-- Labels -->
  <text x="50" y="190" font-family="Arial" font-size="10" fill="#000" text-anchor="middle">Goomba 1</text>
  <text x="150" y="190" font-family="Arial" font-size="10" fill="#000" text-anchor="middle">Goomba 2</text>
  <text x="250" y="190" font-family="Arial" font-size="10" fill="#000" text-anchor="middle">Koopa 1</text>
  <text x="350" y="190" font-family="Arial" font-size="10" fill="#000" text-anchor="middle">Koopa 2</text>
  <text x="450" y="190" font-family="Arial" font-size="10" fill="#000" text-anchor="middle">Paragoomba 1</text>
  <text x="550" y="190" font-family="Arial" font-size="10" fill="#000" text-anchor="middle">Paragoomba 2</text>
</svg>